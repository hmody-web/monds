name: mundas
description: "مندس - لعبة رسم وخداع اجتماعية عربية"
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  path_provider: ^2.1.5
  crypto: ^3.0.6
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  device_preview_plus: ^2.5.5
  window_manager: ^0.5.2
  flutter_scene: ^0.23.0
  vector_math: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/words_ar.json
    - assets/images/app_icon.png
    - assets/images/app_icon_1024.png
    - assets/images/heads_up_card.webp
    - assets/images/draw_guess_card.webp
    - assets/images/killer_killed_card.webp
    - assets/models/killer_killed_character.glb
  fonts:
    - family: ExpoArabic
      fonts:
        - asset: assets/fonts/ExpoArabicBold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon_1024.png
  remove_alpha_ios: true
  background_color_ios: "#219587"
  min_sdk_android: 23
  web:
    generate: true
    image_path: assets/images/app_icon_1024.png
    background_color: "#219587"
    theme_color: "#219587"
  windows:
    generate: true
    image_path: assets/images/app_icon_1024.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/app_icon_1024.png
