workflows:
  mundas-ios-unsigned:
    name: Mundas iOS Unsigned
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Prepare iOS platform
        script: |
          set -e

          if [ ! -d "ios" ]; then
            flutter create               --platforms=ios               --org com.scrptaty               --project-name mundas               .
          fi

          echo "iOS directory ready."

      - name: Configure iOS
        script: |
          set -e

          if [ -f "tool/configure_platforms.py" ]; then
            python3 tool/configure_platforms.py
          fi

          if [ -f "ios/Runner/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName مندس" ios/Runner/Info.plist 2>/dev/null ||             /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string مندس" ios/Runner/Info.plist

            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription يستخدم مندس الكاميرا لمسح رمز QR والانضمام إلى الغرف." ios/Runner/Info.plist 2>/dev/null ||             /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string يستخدم مندس الكاميرا لمسح رمز QR والانضمام إلى الغرف." ios/Runner/Info.plist
          fi

      - name: Get packages
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: Generate launcher icons
        script: |
          set -e
          dart run flutter_launcher_icons

      - name: CocoaPods check
        script: |
          set -e

          if [ -f "ios/Podfile" ]; then
            echo "Podfile found. Installing CocoaPods dependencies..."
            cd ios
            pod install --repo-update
            cd ..
          else
            echo "No ios/Podfile found."
            echo "Skipping manual pod install; Flutter/Xcode will manage the available iOS dependency integration."
          fi

      - name: Build unsigned iOS release
        script: |
          set -e
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA and ZIP
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          OUT="$CM_BUILD_DIR/codemagic_artifacts"
          PAYLOAD="$OUT/Payload"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app was not found at $APP_PATH"
            exit 1
          fi

          rm -rf "$OUT"
          mkdir -p "$PAYLOAD"
          cp -R "$APP_PATH" "$PAYLOAD/Runner.app"

          cd "$OUT"
          /usr/bin/zip -qry "$CM_BUILD_DIR/Mundas_Unsigned.ipa" Payload
          /usr/bin/zip -qry "$CM_BUILD_DIR/Mundas_Unsigned.zip" Payload

    artifacts:
      - Mundas_Unsigned.ipa
      - Mundas_Unsigned.zip
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
