workflows:
  mundas-ios-unsigned:
    name: Mundas iOS Unsigned - CocoaPods Stable
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Force CocoaPods and recreate clean iOS project
        script: |
          set -e

          # Flutter 3.44+ uses SwiftPM by default. For this build we deliberately
          # use CocoaPods to avoid native SwiftPM launch/runtime issues.
          flutter config --no-enable-swift-package-manager

          rm -rf ios
          flutter create \
            --platforms=ios \
            --org com.scrptaty \
            --project-name mundas \
            .

          # Replace the generated Podfile with the stable project Podfile.
          if [ ! -f "$CM_BUILD_DIR/ios/Podfile" ]; then
            echo "ERROR: ios/Podfile is missing after project preparation."
            exit 1
          fi

      - name: Configure iOS
        script: |
          set -e
          python3 tool/configure_platforms.py

      - name: Get packages
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: Generate launcher icons
        script: |
          set -e
          dart run flutter_launcher_icons

      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod deintegrate || true
          pod repo update
          pod install
          cd ..

      - name: Verify native integration
        script: |
          set -e
          test -f ios/Podfile
          test -d ios/Pods
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata
          echo "CocoaPods integration verified."

      - name: Build unsigned iOS release
        script: |
          set -e
          flutter build ios --release --no-codesign --verbose

      - name: Package unsigned IPA and ZIP
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          OUT="$CM_BUILD_DIR/codemagic_artifacts"
          PAYLOAD="$OUT/Payload"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app was not found at $APP_PATH"
            exit 1
          fi

          rm -rf "$OUT"
          mkdir -p "$PAYLOAD"

          /usr/bin/ditto "$APP_PATH" "$PAYLOAD/Runner.app"

          cd "$OUT"
          /usr/bin/zip -qry "$CM_BUILD_DIR/Mundas_Unsigned.ipa" Payload
          /usr/bin/zip -qry "$CM_BUILD_DIR/Mundas_Unsigned.zip" Payload

          echo "Created Mundas_Unsigned.ipa and Mundas_Unsigned.zip"

    artifacts:
      - Mundas_Unsigned.ipa
      - Mundas_Unsigned.zip
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
