workflows:
  mundas-ios-unsigned:
    name: Mundas iOS Unsigned
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Use CocoaPods integration
        script: |
          set -e
          flutter config --no-enable-swift-package-manager

          if [ ! -d "ios/Runner.xcodeproj" ]; then
            echo "iOS project is missing. Creating it..."
            flutter create \
              --platforms=ios \
              --org com.scrptaty \
              --project-name mundas \
              .
          fi

          if [ ! -f "ios/Podfile" ]; then
            echo "ERROR: ios/Podfile is missing from repository."
            exit 1
          fi

      - name: Get packages
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: Configure iOS 15 and bundle
        script: |
          set -e
          python3 tool/configure_platforms.py

          echo "Podfile platform:"
          grep "platform :ios" ios/Podfile

          echo "Xcode deployment targets:"
          grep "IPHONEOS_DEPLOYMENT_TARGET" ios/Runner.xcodeproj/project.pbxproj | sort -u || true

      - name: Generate launcher icons
        script: |
          set -e
          dart run flutter_launcher_icons

      - name: Install CocoaPods
        script: |
          set -e
          cd ios

          rm -rf Pods Podfile.lock
          pod deintegrate || true
          pod install --repo-update

          cd ..

      - name: Verify CocoaPods integration
        script: |
          set -e
          test -d ios/Pods
          test -f ios/Podfile.lock
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata
          echo "CocoaPods integration verified."

      - name: Build unsigned iOS release
        script: |
          set -e
          flutter build ios \
            --release \
            --no-codesign

      - name: Package unsigned IPA and ZIP
        script: |
          set -e

          APP_PATH="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          OUT="$CM_BUILD_DIR/codemagic_artifacts"
          PAYLOAD="$OUT/Payload"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app was not found at $APP_PATH"
            exit 1
          fi

          rm -rf "$OUT"
          mkdir -p "$PAYLOAD"
          /usr/bin/ditto "$APP_PATH" "$PAYLOAD/Runner.app"

          cd "$OUT"
          /usr/bin/zip -qry "$CM_BUILD_DIR/Mundas_Unsigned.ipa" Payload
          /usr/bin/zip -qry "$CM_BUILD_DIR/Mundas_Unsigned.zip" Payload

          echo "Created Mundas_Unsigned.ipa"
          echo "Created Mundas_Unsigned.zip"

    artifacts:
      - Mundas_Unsigned.ipa
      - Mundas_Unsigned.zip
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
